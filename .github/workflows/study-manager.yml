name: 🏆 Weekly Study Leaderboard

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch: 

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Get Last Week Date
        id: date
        run: echo "since=$(date -d '7 days ago' +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Calculate Ranking
        id: ranking
        run: |
          ORG_NAME="dangerous-office-workers"
          SINCE_DATE="${{ steps.date.outputs.since }}"
          echo "[INFO] $ORG_NAME 의 $SINCE_DATE 이후 기록을 찾습니다..."

          # 1. gh search 명령어로 커밋 작성자 아이디만 정확히 추출 (에러 발생 시 빈값 처리)
          # jq 필터를 강화하여 오직 영문/숫자 아이디만 뽑아오도록 설정
          AUTHORS=$(gh search commits --owner "$ORG_NAME" --author-date ">=$SINCE_DATE" --limit 100 --json author --jq '.[].author.login' 2>/dev/null || echo "")

          # 2. 결과 메시지 작성 시작
          {
            echo "content<<EOF"
            echo "📢 *[위험한 직장인들] 이번 주 스터디 랭킹 정리*"
            echo ""
            
            # AUTHORS가 비어있거나 에러 메시지가 섞인 경우 방지
            if [ -z "$AUTHORS" ] || [[ "$AUTHORS" == *"message"* ]]; then
              echo "지난주에는 활동한 멤버가 없네요. 모두 분발하세요! ❄️"
            else
              echo "지난 일주일간의 명예의 전당입니다! 🏆"
              # 랭킹 계산 (실제 아이디가 있는 경우만 처리)
              echo "$AUTHORS" | grep -v "null" | sort | uniq -c | sort -rn | awk '
                BEGIN { rank=1 }
                {
                  emoji = (rank == 1 ? "🥇" : (rank == 2 ? "🥈" : (rank == 3 ? "🥉" : "•")))
                  printf "%s %d위: @%s (%d commits)\n", emoji, rank, $2, $1
                  rank++
                }'
            fi
            echo ""
            echo "_순위에 없으신 분들은 다음 주를 노려보세요! 🔥_"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.ORG_LEADERBOARD_TOKEN }}

      - name: Send to Slack
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ${{ toJSON(steps.ranking.outputs.content) }}
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
